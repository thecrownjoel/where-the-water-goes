[package]
name = "where-the-water-goes"
version = "0.1.0"
description = "Open-source screensaver visualizing public U.S. water data"
authors = ["Where the Water Goes contributors"]
license = "Apache-2.0"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "wtrshd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
starship-battery = "0.12"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
user-idle = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
