name: Data source proposal
description: Suggest a dataset to show or bundle.
labels: [data]
body:
  - type: input
    id: dataset
    attributes:
      label: Dataset and publisher
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: Endpoint or download URL
    validations: { required: true }
  - type: textarea
    id: terms
    attributes:
      label: License or terms (with a link)
      description: Public domain, CC BY, or other. We can't use data that needs a per-user login or forbids redistribution.
    validations: { required: true }
  - type: textarea
    id: meaning
    attributes:
      label: What would a value on the globe mean, and what are its limits?
      description: Measurement, estimate, model output? How current? What can people mistake it for?
    validations: { required: true }
